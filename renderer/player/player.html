<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>播放 · 摸鱼收藏夹</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    #root { display: flex; flex-direction: column; height: 100vh; background: var(--bg); }
    .pbar { flex: 0 0 34px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
      -webkit-app-region: drag; border-bottom: 1px solid var(--border); background: var(--surface); }
    .pbar .brand { font-weight: 600; font-size: 12px; color: var(--text-soft); }
    .pbar .sp { flex: 1; }
    .pbar button { -webkit-app-region: no-drag; background: transparent; border: 0; color: var(--text-mute);
      cursor: pointer; font-size: 16px; padding: 2px 8px; border-radius: 6px; }
    .pbar button:hover { background: var(--accent-soft); color: var(--accent); }
    .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
      background: #000; overflow: hidden; }
    .stage video { max-width: 100%; max-height: 100%; background: #000; }
    .stage img.cover { max-width: 100%; max-height: 100%; object-fit: contain; opacity: .6; }
    /* 标题悬浮层：默认隐藏，鼠标移到舞台（视频）时才淡入，且不超出边界 */
    .meta { position: absolute; left: 0; right: 0; top: 0; z-index: 2;
      padding: 12px 14px 22px; box-sizing: border-box;
      background: linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,0));
      opacity: 0; transition: opacity .25s; pointer-events: none; }
    .stage:hover .meta { opacity: 1; }
    .meta .title { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.4;
      max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word; }
    .meta .author { font-size: 12px; color: rgba(255,255,255,.8); margin-top: 4px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fallback { z-index: 4; }
    .fallback { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; background: rgba(0,0,0,.82); color: #fff; text-align: center; padding: 24px; }
    .fallback.show { display: flex; }
    .fallback p { font-size: 13px; line-height: 1.6; opacity: .9; }
    .pctrl { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 7px 12px;
      background: var(--surface); border-top: 1px solid var(--border); }
    .pctrl .lbl { font-size: 11px; color: var(--text-mute); margin-right: 2px; }
    .spd { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-soft);
      border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; transition: all .15s; }
    .qsel { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .qbtn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-soft);
      border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; transition: all .15s; }
    .qbtn:hover { border-color: var(--accent); color: var(--accent); }
    .qbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .spd:hover { border-color: var(--accent); color: var(--accent); }
    .spd.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pctrl .hint { margin-left: auto; font-size: 11px; color: var(--accent); opacity: 0; transition: opacity .3s; }
    .pctrl .hint.show { opacity: 1; }
    .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      background: rgba(0,0,0,.78); color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 20px;
      opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 5; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="root">
    <div class="pbar">
      <span class="brand">🎬 播放</span>
      <span class="sp"></span>
      <button id="btn-browser" title="在浏览器打开">↗</button>
      <button id="btn-close" title="关闭">×</button>
    </div>
    <div class="stage" id="stage">
      <video id="video" controls autoplay playsinline></video>
      <img class="cover" id="cover" style="display:none" />
      <div class="fallback" id="fallback">
        <p>无法在应用内直接播放。<br>该视频地址可能已失效或需要浏览器环境。</p>
        <button class="btn primary" id="btn-open">在浏览器打开</button>
      </div>
      <div class="meta">
        <div class="title" id="m-title"></div>
        <div class="author" id="m-author"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="pctrl" id="pctrl"><span class="lbl">倍速</span><span class="hint" id="resume-hint"></span></div>
    <div class="pctrl" id="qctrl" style="border-top:0; padding-top:0; display:none;"><span class="lbl">画质</span><span class="qsel" id="qsel"></span></div>
  </div>
  <script src="player.js"></script>
</body>
</html>
